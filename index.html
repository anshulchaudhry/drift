<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift — Focus Timer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="focus-mode">

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="drift-atmosphere">
        <div class="drift-glow"></div>
        <div class="drift-wave"></div>
    </div>

    <main class="app">

        <header class="header">
            <div class="brand">DRIFT</div>
            <p class="tagline">drift into focus</p>
        </header>

        <section class="timer-section">

            <p class="mode-label">FOCUS</p>

            <div class="timer">
                <span>25</span>
                <span class="colon">:</span>
                <span>00</span>
            </div>

            <div class="drift-line">
                <span class="drift-dot"></span>
            </div>

            <p class="timer-message">take your time getting there.</p>

            <div class="timer-controls">
                <button class="start-button">Begin</button>
                <button class="reset-button">Reset</button>
            </div>

        </section>

        <footer class="footer">

            <div class="mode-selector">
                <button class="mode active" data-mode="focus">
                    <span class="mode-indicator"></span>
                    Focus
                </button>

                <button class="mode" data-mode="short-break">
                    <span class="mode-indicator"></span>
                    Short break
                </button>

                <button class="mode" data-mode="long-break">
                    <span class="mode-indicator"></span>
                    Long break
                </button>
            </div>

            <div class="session">
                <span>SESSION</span>
                <span class="session-number">01 / 04</span>
            </div>

        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
